[package]
name = "bmo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
dirs = "6.0.0"
gpui = "0.2.2"
gpui-component = "0.4.0-preview1"
notify-rust = "4.16.0"
rand = "0.9.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }
rust-embed = "8.9.0"
sqlx = {version="0.8.6", features=["runtime-async-std", "sqlite", "chrono"]}

[profile.release]
lto = "thin"
strip = "symbols"

[profile.release-distro]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "s"

[package.metadata.bundle]
name = "Bmo"
identifier = "com.rubbietheone.bmo"
icon = []
